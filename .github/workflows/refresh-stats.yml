name: Refresh GitHub activity SVGs

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch stats + streak into assets
        run: python -c "from scripts.generate_cinematic_cards import refresh_activity_svgs; refresh_activity_svgs()"
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/github-streak.svg
          git diff --staged --quiet || git commit -m "chore: refresh self-hosted GitHub stats SVGs"
          git push
