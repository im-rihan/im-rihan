<svg xmlns="http://www.w3.org/2000/svg" width="92" height="34" viewBox="0 0 92 34" role="img">
  <title>linkedin</title>
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="91" height="33" rx="10" fill="url(#g)" stroke="#0A66C2" stroke-opacity="0.5">
    <animate attributeName="stroke-opacity" values="0.3;0.85;0.3" dur="3s" begin="0.1s" repeatCount="indefinite"/>
  </rect>
  <circle cx="12" cy="17" r="2.4" fill="#0A66C2">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="2.2s" begin="0.1s" repeatCount="indefinite"/>
  </circle>
  <text x="50.0" y="21" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="11" font-weight="700" fill="#e2e8f0">linkedin</text>
</svg>
