<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Rihan Mohammed - Full Stack Developer</title>
  <desc id="desc">Cinematic teal aurora HUD banner for GitHub profile</desc>
  <defs>
    <linearGradient id="void" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="45%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="auroraA" cx="22%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#0f766e" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraB" cx="78%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#0f766e" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraC" cx="55%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0"/>
      <stop offset="40%" stop-color="#14b8a6" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="55%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#99f6e4"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.85  0 0 0 0 0.9  0 0 0 0 0.95  0 0 0 0.04 0" in="noise" result="tint"/>
      <feBlend in="SourceGraphic" in2="tint" mode="overlay"/>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="360" rx="18" ry="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#void)"/>
    <ellipse cx="260" cy="140" rx="320" ry="160" fill="url(#auroraA)" filter="url(#softGlow)">
      <animate attributeName="cx" values="240;300;240" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;1;0.85" dur="8s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="920" cy="110" rx="280" ry="140" fill="url(#auroraB)" filter="url(#softGlow)">
      <animate attributeName="cy" values="100;140;100" dur="16s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="640" cy="300" rx="360" ry="100" fill="url(#auroraC)"/>

    <!-- subtle perspective grid floor -->
    <g opacity="0.18" stroke="#14b8a6" stroke-width="1" fill="none">
      <path d="M0 290 L600 240 L1200 290"/>
      <path d="M80 360 L600 250 L1120 360"/>
      <path d="M200 360 L600 255 L1000 360"/>
      <path d="M340 360 L600 260 L860 360"/>
      <path d="M480 360 L600 265 L720 360"/>
      <line x1="0" y1="300" x2="1200" y2="300"/>
      <line x1="0" y1="320" x2="1200" y2="320"/>
      <line x1="0" y1="340" x2="1200" y2="340"/>
    </g>

    <!-- HUD corner brackets -->
    <g stroke="#14b8a6" stroke-width="1.5" fill="none" opacity="0.55">
      <path d="M28 58 L28 28 L58 28"/>
      <path d="M1142 28 L1172 28 L1172 58"/>
      <path d="M28 302 L28 332 L58 332"/>
      <path d="M1142 332 L1172 332 L1172 302"/>
    </g>

    <!-- amber accent hairline -->
    <rect x="80" y="118" width="72" height="3" rx="1.5" fill="#f59e0b" opacity="0.9"/>

    <text x="80" y="168" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="url(#wordmark)" letter-spacing="-0.5">Rihan Mohammed</text>
    <text x="80" y="208" font-family="JetBrains Mono, Consolas, monospace" font-size="18" font-weight="600" fill="#14b8a6" letter-spacing="2.5">FULL STACK DEVELOPER</text>
    <text x="80" y="242" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#94a3b8">Fintech &amp; Real-Estate Systems - HomeAbroad Inc. - Ziffy.ai</text>

    <!-- glass status pill -->
    <g transform="translate(80, 268)">
      <rect width="168" height="28" rx="8" fill="rgba(15,118,110,0.25)" stroke="#14b8a6" stroke-opacity="0.45"/>
      <circle cx="16" cy="14" r="4" fill="#22c55e">
        <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <text x="28" y="18" font-family="JetBrains Mono, Consolas, monospace" font-size="12" font-weight="600" fill="#e2e8f0">AVAILABLE FOR WORK</text>
    </g>

    <!-- right HUD data callouts -->
    <g transform="translate(860, 120)" font-family="JetBrains Mono, Consolas, monospace" fill="#94a3b8" font-size="11">
      <rect x="0" y="0" width="240" height="120" rx="12" fill="rgba(15,23,42,0.55)" stroke="rgba(20,184,166,0.28)"/>
      <text x="18" y="28" fill="#14b8a6" font-weight="700">SYSTEM SIGNAL</text>
      <text x="18" y="54" fill="#e2e8f0">4+ yrs production</text>
      <text x="18" y="74" fill="#e2e8f0">AI search - pipelines</text>
      <text x="18" y="94" fill="#e2e8f0">NestJS - Next.js - AWS</text>
    </g>

    <rect width="1200" height="360" fill="url(#sheen)" opacity="0.18">
      <animate attributeName="opacity" values="0.12;0.22;0.12" dur="10s" repeatCount="indefinite"/>
    </rect>
    <rect width="1200" height="360" filter="url(#grain)" opacity="0.35"/>
  </g>
</svg>
