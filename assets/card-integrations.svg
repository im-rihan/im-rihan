    <path d="M40 42 L340 42 L340 172 L40 172 Z" fill="url(#face)" stroke="#f59e0b" stroke-opacity="0.45"/>
    <rect x="40" y="42" width="300" height="130" fill="url(#sheen)"><animate attributeName="x" values="-260;340" dur="6s" begin="0.8s" repeatCount="indefinite"/></rect>
