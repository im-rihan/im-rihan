    <linearGradient id="face" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#122033"/><stop offset="100%" stop-color="#0b1524"/></linearGradient>
    <linearGradient id="side" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#f59e0b" stop-opacity="0.55"/><stop offset="100%" stop-color="#0f766e" stop-opacity="0.25"/></linearGradient>
    <linearGradient id="top" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22"/><stop offset="100%" stop-color="#f59e0b" stop-opacity="0.12"/></linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity="0.16"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <radialGradient id="glow" cx="20%" cy="18%" r="50%"><stop offset="0%" stop-color="#f59e0b" stop-opacity="0.45"/><stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="10" flood-color="#000" flood-opacity="0.55"/></filter>
  </defs>
  <rect width="400" height="240" fill="url(#void)"/>
  <ellipse cx="90" cy="50" rx="130" ry="70" fill="url(#glow)"><animate attributeName="opacity" values="0.7;1;0.7" dur="4s" begin="0.8s" repeatCount="indefinite"/></ellipse>
  <path d="M30 205 L210 185 L370 205 L190 225 Z" fill="#14b8a6" opacity="0.08"/>
  <g filter="url(#shadow)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0" dur="5s" begin="0.8s" repeatCount="indefinite"/>
    <path d="M340 42 L370 58 L370 188 L340 172 Z" fill="url(#side)"/>
