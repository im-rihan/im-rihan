<svg xmlns="http://www.w3.org/2000/svg" width="400" height="240" viewBox="0 0 400 240" role="img">
  <title>Hub + Pricer</title>
  <defs>
    <linearGradient id="void" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#122033"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1524"/>
    </linearGradient>
    <linearGradient id="side" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="top" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.12"/>
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="18%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="10" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="400" height="240" fill="url(#void)"/>
  <ellipse cx="90" cy="50" rx="130" ry="70" fill="url(#glow)"/>
  <!-- floor plane -->
  <path d="M30 205 L210 185 L370 205 L190 225 Z" fill="#f59e0b" opacity="0.08"/>
  <g filter="url(#shadow)">
    <!-- right extrusion (depth) -->
    <path d="M340 42 L370 58 L370 188 L340 172 Z" fill="url(#side)"/>
    <!-- top bevel -->
    <path d="M40 42 L70 26 L370 58 L340 42 Z" fill="url(#top)"/>
    <!-- main face -->
    <path d="M40 42 L340 42 L340 172 L40 172 Z" fill="url(#face)" stroke="#f59e0b" stroke-opacity="0.45"/>
  </g>
  <rect x="40" y="42" width="300" height="3" fill="#f59e0b" opacity="0.85"/>
  <g stroke="#f59e0b" stroke-width="1.3" fill="none" opacity="0.65">
    <path d="M52 58 L52 50 L62 50"/>
    <path d="M318 50 L328 50 L328 58"/>
    <path d="M52 156 L52 164 L62 164"/>
    <path d="M318 164 L328 164 L328 156"/>
  </g>
  <text x="58" y="72" font-family="JetBrains Mono, Consolas, monospace" font-size="10" font-weight="700" fill="#f59e0b" letter-spacing="2">INTEGRATIONS</text>
  <text x="58" y="100" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#f8fafc">Hub + Pricer</text>
  <text x="58" y="120" font-family="JetBrains Mono, Consolas, monospace" font-size="10" fill="#f59e0b">PHP 8.3 · Puppeteer · AWS Lambda</text>
  <text x="48" y="132" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#94a3b8">60+ webhooks, 12+ AI agent tools, and</text>
<text x="48" y="149" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#94a3b8">live rates from 11 Non-QM / DSCR lender</text>
<text x="48" y="166" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#94a3b8">portals.</text>
</svg>
