    <path d="M340 42 L370 58 L370 188 L340 172 Z" fill="url(#side)"/>
    <path d="M40 42 L70 26 L370 58 L340 42 Z" fill="url(#top)"/>
    <path d="M40 42 L340 42 L340 172 L40 172 Z" fill="url(#face)" stroke="#14b8a6" stroke-opacity="0.45"/>
    <rect x="40" y="42" width="300" height="130" fill="url(#sheen)">
      <animate attributeName="x" values="-260;340" dur="6s" begin="0s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="40" y="42" width="300" height="3" fill="#14b8a6" opacity="0.85">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" begin="0s" repeatCount="indefinite"/>
  </rect>
  <g stroke="#14b8a6" stroke-width="1.3" fill="none" opacity="0.65">
    <path d="M52 58 L52 50 L62 50"/>
    <path d="M318 50 L328 50 L328 58"/>
    <path d="M52 156 L52 164 L62 164"/>
    <path d="M318 164 L328 164 L328 156"/>
