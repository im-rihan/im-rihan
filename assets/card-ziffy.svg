  <text x="58" y="100" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#f8fafc">Ziffy.ai</text>
  <text x="58" y="120" font-family="JetBrains Mono, Consolas, monospace" font-size="10" fill="#f59e0b">Next.js 15 · React 19 · SSE · Vercel</text>
  <text x="48" y="132" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#94a3b8">AI investor platform with streaming NLP</text>
<text x="48" y="149" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#94a3b8">search, ISR SEO listings, and DSCR /</text>
<text x="48" y="166" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#94a3b8">pre-approval flows.</text>
